
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{padding:1rem;display:flex;flex-direction:column;align-items:center;gap:1rem;font-family:var(--font-sans);}
.status-row{display:flex;gap:0;width:100%;border-radius:var(--border-radius-lg);overflow:hidden;border:0.5px solid var(--color-border-tertiary);}
.stat{flex:1;text-align:center;padding:10px 8px;background:var(--color-background-secondary);}
.stat+.stat{border-left:0.5px solid var(--color-border-tertiary);}
.stat .num{font-size:24px;font-weight:500;line-height:1;}
.stat .lbl{font-size:11px;color:var(--color-text-secondary);margin-top:3px;}
.clock-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;}
.elapsed-row{font-size:13px;color:var(--color-text-secondary);font-variant-numeric:tabular-nums;}
.elapsed-row span{font-size:16px;font-weight:500;color:var(--color-text-primary);}
.cd-row-wrap{display:flex;gap:12px;justify-content:center;}
.cd-item{display:flex;align-items:center;gap:8px;}
.cd-lbl{font-size:12px;color:var(--color-text-secondary);}
.cd-digits{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--color-text-primary);min-width:40px;transition:color 0.2s;}
.cd-digits.urgent{color:var(--color-text-danger);}
.cd-btn{padding:3px 10px;font-size:12px;font-weight:500;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;color:var(--color-text-secondary);white-space:nowrap;}
.cd-btn.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
.seg-group{display:flex;width:100%;border-radius:var(--border-radius-md);overflow:hidden;border:0.5px solid var(--color-border-secondary);}
.seg-group label{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-secondary);transition:all 0.12s;}
.seg-group label:last-child{border-right:none;}
.seg-group input[type=radio]{display:none;}
.seg-group input[type=radio]:checked+label{background:var(--color-text-primary);color:var(--color-background-primary);}
.seg-lbl{font-size:11px;color:var(--color-text-secondary);margin-bottom:2px;}
.done-msg{font-size:13px;color:var(--color-text-secondary);height:18px;text-align:center;}
.start-btn{width:189px;height:189px;border-radius:50%;border:none;background:var(--color-text-primary);color:var(--color-background-primary);font-size:26px;font-weight:500;cursor:pointer;letter-spacing:0.3px;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.start-btn:active{opacity:0.7;}
.start-btn.paused{background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary);}
.reset-btn{padding:10px 32px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:14px;font-weight:500;cursor:pointer;color:var(--color-text-secondary);}
.reset-btn:active{opacity:0.6;}
</style>

<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Rep counter</h2>
<div class="app">
  <div class="status-row">
    <div class="stat"><div class="num" id="sets-done">0</div><div class="lbl">sets done</div></div>
    <div class="stat"><div class="num" id="rep-done">0</div><div class="lbl">rep</div></div>
    <div class="stat"><div class="num" id="rep-total-show">20</div><div class="lbl">total reps</div></div>
  </div>

  <div class="clock-wrap">
    <svg width="260" height="260" viewBox="-10 -10 280 280" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;">
      <circle cx="130" cy="130" r="120" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
      <circle cx="130" cy="130" r="108" fill="none" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
      <g id="ticks"></g>
      <circle id="prog-arc" cx="130" cy="130" r="108" fill="none" stroke="var(--color-text-primary)" stroke-width="5" stroke-dasharray="678.6" stroke-dashoffset="678.6" stroke-linecap="round" transform="rotate(-90 130 130)"/>
      <line id="hand" x1="130" y1="130" x2="130" y2="32" stroke="var(--color-text-primary)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="130" cy="130" r="5" fill="var(--color-text-primary)"/>
      <rect x="88" y="98" width="84" height="60" rx="12" fill="var(--color-text-primary)" opacity="0.9"/>
      <text id="count-txt" x="130" y="147" text-anchor="middle" font-size="46" font-weight="500" fill="var(--color-background-primary)" font-family="var(--font-sans)">0</text>
      <text id="done-label" x="130" y="180" text-anchor="middle" font-size="13" fill="var(--color-text-secondary)" font-family="var(--font-sans)" opacity="0"></text>
    </svg>
    <div class="elapsed-row">elapsed <span id="time-digits">0:00</span></div>
  </div>

  <div class="cd-row-wrap">
    <div class="cd-item">
      <span class="cd-lbl">40s</span>
      <span class="cd-digits" id="cd40-digits">0:40</span>
      <button class="cd-btn" id="cd40-btn">Start</button>
    </div>
    <div class="cd-item" style="border-left:0.5px solid var(--color-border-tertiary);padding-left:12px;">
      <span class="cd-lbl">1m</span>
      <span class="cd-digits" id="cd60-digits">1:00</span>
      <button class="cd-btn" id="cd60-btn">Start</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px;width:100%;">
    <span class="seg-lbl">Reps</span>
    <div class="seg-group">
      <input type="radio" name="reps" id="r12" value="12"><label for="r12">12</label>
      <input type="radio" name="reps" id="r15" value="15"><label for="r15">15</label>
      <input type="radio" name="reps" id="r20" value="20" checked><label for="r20">20</label>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px;width:100%;">
    <span class="seg-lbl">Pace</span>
    <div class="seg-group">
      <input type="radio" name="pace" id="p3" value="3"><label for="p3">3s / rep</label>
      <input type="radio" name="pace" id="p5" value="5" checked><label for="p5">5s / rep</label>
      <input type="radio" name="pace" id="p7" value="7"><label for="p7">7s / rep</label>
    </div>
  </div>

  <div class="done-msg" id="done-msg"></div>
  <button class="start-btn" id="btn-start">Start</button>
  <button class="reset-btn" id="btn-reset">Reset all</button>
</div>

<script>
(function(){
  const CIRC=2*Math.PI*108;
  let totalReps=20,secPerRep=5,setsDone=0;
  let running=false,raf=null,startTime=null,elapsed=0,lastRepIdx=-1;
  const CD_INIT={40:40000,60:60000};
  const cdState={
    40:{running:false,remaining:40000,raf:null,lastTs:null,done:false},
    60:{running:false,remaining:60000,raf:null,lastTs:null,done:false}
  };
  let _actx=null;
  function actx(){
    if(!_actx) _actx=new(window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    return _actx;
  }

  function playTing(){
    try{
      const c=actx();
      const freq=1480;
      const osc=c.createOscillator();
      const gain=c.createGain();
      const osc2=c.createOscillator();
      const gain2=c.createGain();

      osc.type='sine';
      osc.frequency.setValueAtTime(freq,c.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq*0.98,c.currentTime+0.3);
      gain.gain.setValueAtTime(0.0001,c.currentTime);
      gain.gain.linearRampToValueAtTime(0.9,c.currentTime+0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.55);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(c.currentTime); osc.stop(c.currentTime+0.6);

      osc2.type='sine';
      osc2.frequency.setValueAtTime(freq*2,c.currentTime);
      gain2.gain.setValueAtTime(0.0001,c.currentTime);
      gain2.gain.linearRampToValueAtTime(0.35,c.currentTime+0.003);
      gain2.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.2);
      osc2.connect(gain2); gain2.connect(c.destination);
      osc2.start(c.currentTime); osc2.stop(c.currentTime+0.25);
    }catch(e){}
  }

  function playDing(){
    try{
      const c=actx();
      [523.25,659.25,783.99].forEach((freq,i)=>{
        const osc=c.createOscillator(),g=c.createGain();
        osc.connect(g); g.connect(c.destination); osc.type='sine'; osc.frequency.value=freq;
        const t=c.currentTime+i*0.2;
        g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.5,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
        osc.start(t); osc.stop(t+1.2);
      });
    }catch(e){}
  }

  function playCdDone(){
    try{
      const c=actx();
      [800,600,400].forEach((freq,i)=>{
        const osc=c.createOscillator(),g=c.createGain();
        osc.connect(g); g.connect(c.destination); osc.type='triangle'; osc.frequency.value=freq;
        const t=c.currentTime+i*0.18;
        g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.55);
        osc.start(t); osc.stop(t+0.6);
      });
    }catch(e){}
  }

  function fmtMs(ms){
    const s=Math.ceil(ms/1000),m=Math.floor(s/60),ss=s%60;
    return m+':'+(ss<10?'0'+ss:ss);
  }
  function drawTicks(){
    const g=document.getElementById('ticks'); g.innerHTML='';
    for(let i=0;i<totalReps;i++){
      const rad=(i/totalReps)*2*Math.PI-Math.PI/2;
      const r2=i%5===0?91:97;
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',(130+108*Math.cos(rad)).toFixed(2)); l.setAttribute('y1',(130+108*Math.sin(rad)).toFixed(2));
      l.setAttribute('x2',(130+r2*Math.cos(rad)).toFixed(2));  l.setAttribute('y2',(130+r2*Math.sin(rad)).toFixed(2));
      l.setAttribute('stroke','var(--color-border-secondary)'); l.setAttribute('stroke-width',i%5===0?'1.5':'0.8');
      g.appendChild(l);
    }
  }
  function setHand(frac){
    const a=(frac*360-90)*Math.PI/180;
    document.getElementById('hand').setAttribute('x2',(130+98*Math.cos(a)).toFixed(2));
    document.getElementById('hand').setAttribute('y2',(130+98*Math.sin(a)).toFixed(2));
  }
  function setArc(frac){ document.getElementById('prog-arc').setAttribute('stroke-dashoffset',(CIRC*(1-frac)).toFixed(2)); }
  function updateRepsUI(){
    document.getElementById('rep-total-show').textContent=totalReps;
    drawTicks();
  }
  function finishSet(){
    running=false; if(raf){cancelAnimationFrame(raf);raf=null;}
    setsDone++; document.getElementById('sets-done').textContent=setsDone;
    setHand(1); setArc(1);
    document.getElementById('count-txt').textContent=totalReps;
    document.getElementById('rep-done').textContent=totalReps;
    document.getElementById('done-msg').textContent=setsDone===1?'1 set done!':setsDone+' sets done!';
    playDing();
    const btn=document.getElementById('btn-start');
    btn.textContent='Start'; btn.classList.remove('paused');
    startTime=null; elapsed=0; lastRepIdx=-1;
  }
  function mainTick(ts){
    if(!startTime) startTime=ts;
    elapsed=ts-startTime;
    const msPerRep=secPerRep*1000,totalMs=msPerRep*totalReps;
    if(elapsed>=totalMs){finishSet();return;}
    const repIdx=Math.floor(elapsed/msPerRep);
    if(repIdx!==lastRepIdx){playTing();lastRepIdx=repIdx;}
    setHand(elapsed/totalMs); setArc(repIdx/totalReps);
    document.getElementById('count-txt').textContent=repIdx+1;
    document.getElementById('rep-done').textContent=repIdx+1;
    const s=Math.floor(elapsed/1000),m=Math.floor(s/60),ss=s%60;
    document.getElementById('time-digits').textContent=m+':'+(ss<10?'0'+ss:ss);
    if(running) raf=requestAnimationFrame(mainTick);
  }
  function cdLoop(key,ts){
    const st=cdState[key];
    if(!st.lastTs) st.lastTs=ts;
    st.remaining=Math.max(0,st.remaining-(ts-st.lastTs));
    st.lastTs=ts;
    const el=document.getElementById('cd'+key+'-digits');
    el.textContent=fmtMs(st.remaining);
    el.classList.toggle('urgent',st.remaining>0&&st.remaining<=10000);
    if(st.remaining<=0){
      el.textContent='0:00'; el.classList.remove('urgent');
      st.running=false; st.raf=null; st.lastTs=null; st.done=true;
      playCdDone();
      const btn=document.getElementById('cd'+key+'-btn');
      btn.textContent='Reset'; btn.classList.remove('active');
      return;
    }
    if(st.running) st.raf=requestAnimationFrame(ts2=>cdLoop(key,ts2));
  }
  function resetCd(key){
    const st=cdState[key];
    if(st.raf){cancelAnimationFrame(st.raf);st.raf=null;}
    st.running=false; st.remaining=CD_INIT[key]; st.lastTs=null; st.done=false;
    const el=document.getElementById('cd'+key+'-digits');
    el.textContent=fmtMs(CD_INIT[key]); el.classList.remove('urgent');
    const btn=document.getElementById('cd'+key+'-btn');
    btn.textContent='Start'; btn.classList.remove('active');
  }
  [40,60].forEach(key=>{
    document.getElementById('cd'+key+'-btn').addEventListener('click',()=>{
      actx();
      const st=cdState[key],btn=document.getElementById('cd'+key+'-btn');
      if(st.done||btn.textContent==='Reset'){resetCd(key);return;}
      if(st.running){
        st.running=false; if(st.raf){cancelAnimationFrame(st.raf);st.raf=null;} st.lastTs=null;
        btn.textContent='Resume'; btn.classList.remove('active');
      } else {
        st.running=true; btn.textContent='Pause'; btn.classList.add('active');
        st.raf=requestAnimationFrame(ts=>cdLoop(key,ts));
      }
    });
  });
  document.getElementById('btn-start').addEventListener('click',()=>{
    actx();
    const btn=document.getElementById('btn-start');
    if(running){
      running=false; if(raf){cancelAnimationFrame(raf);raf=null;}
      btn.textContent='Resume'; btn.classList.add('paused');
    } else {
      running=true;
      document.getElementById('done-msg').textContent='';
      document.getElementById('prog-arc').setAttribute('stroke','var(--color-text-primary)');
      btn.textContent='Pause'; btn.classList.remove('paused');
      if(startTime!==null) startTime=performance.now()-elapsed;
      raf=requestAnimationFrame(mainTick);
    }
  });
  document.getElementById('btn-reset').addEventListener('click',()=>{
    running=false; if(raf){cancelAnimationFrame(raf);raf=null;}
    setsDone=0; elapsed=0; startTime=null; lastRepIdx=-1;
    setHand(0); setArc(0);
    document.getElementById('count-txt').textContent='0';
    document.getElementById('rep-done').textContent='0';
    document.getElementById('sets-done').textContent='0';
    document.getElementById('done-msg').textContent='';
    document.getElementById('prog-arc').setAttribute('stroke','var(--color-text-primary)');
    document.getElementById('time-digits').textContent='0:00';
    const btn=document.getElementById('btn-start'); btn.textContent='Start'; btn.classList.remove('paused');
    resetCd(40); resetCd(60);
    updateRepsUI();
  });
  document.querySelectorAll('input[name=reps]').forEach(r=>{
    r.addEventListener('change',()=>{
      totalReps=parseInt(r.value); updateRepsUI();
      if(startTime!==null) startTime=performance.now()-elapsed;
    });
  });
  document.querySelectorAll('input[name=pace]').forEach(p=>{
    p.addEventListener('change',()=>{
      secPerRep=parseInt(p.value);
      if(startTime!==null) startTime=performance.now()-elapsed;
    });
  });
  updateRepsUI();
})();
</script>
